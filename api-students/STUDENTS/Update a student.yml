  url: '{{puzzle}}/students/:id'
  params:
    - name: id
      value: '9'
      type: path
  body:
    type: json
    data: |-
      {
        "name": "Paul",
        "firstname": "Ochon"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
