info:
  name: Update a teacher
  type: http
  seq: 1

http:
  method: PUT
  url: '{{puzzle}}/teachers/:id'
  params:
    - name: id
      value: '11'
      type: path
  body:
    type: json
    data: |+
      {
        "name": "Greeg",
        "firstname": "Bob",
        "email": "greg.bob@gmail.com"
      }

  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
