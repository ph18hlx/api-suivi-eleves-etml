info:
  name: Add a new teacher
  type: http
  seq: 1

http:
  method: POST
  url: '{{puzzle}}/teachers'
  body:
    type: json
    data: |-
      {
        "name": "Greg",
        "firstname": "Bob",
        "email": "greg.bob@gmail.com"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
